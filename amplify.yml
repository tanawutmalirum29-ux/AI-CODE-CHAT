version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - mkdir -p app
        - unzip -q source/ai-code-chat-source.zip -d app
        - cd app && nvm use 22 && npm install
    build:
      commands:
        - cd app && nvm use 22 && npm run check && npm test && npm run build
  artifacts:
    baseDirectory: app/.amplify-hosting
    files:
      - '**/*'
