name: Recover and extract application source
on:
  push:
    branches: [main]
    paths:
      - ".transfer/parts/**"
permissions:
  contents: write
jobs:
  extract-source:
    if: github.event.head_commit.message != 'Extract ZIP-only application source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Reassemble ZIP from transfer parts
        shell: bash
        run: |
          set -euo pipefail
          test -d .transfer/parts
          find .transfer/parts -maxdepth 1 -type f -name '*.b64' | sort | xargs cat | base64 -d > /tmp/ai-code-chat-source.zip
          unzip -tq /tmp/ai-code-chat-source.zip
      - name: Extract and verify source
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq /tmp/ai-code-chat-source.zip -d .
          test -f package.json
          test -f server.js
          test -f public/index.html
          npm install
          npm run check
          npm test
      - name: Remove transfer data and commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .transfer bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract ZIP-only application source"
          git push origin main
