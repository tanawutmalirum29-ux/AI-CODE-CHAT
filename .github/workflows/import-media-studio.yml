name: Apply Media Studio import

on:
  push:
    branches:
      - ai-code-chat/media-studio-import

permissions:
  contents: write

jobs:
  apply-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-code-chat/media-studio-import
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .import/parts/*.b64 > /tmp/media-studio-import.zip.b64
          test "$(wc -c < /tmp/media-studio-import.zip.b64 | tr -d ' ')" = "103576"
          base64 --decode /tmp/media-studio-import.zip.b64 > /tmp/media-studio-import.zip
          echo "43b671ede6f06bba9009a8ead96119dc9f18d45fa64c3837d5e2d4b7cc1ef5d3  /tmp/media-studio-import.zip" | sha256sum --check
          unzip -t /tmp/media-studio-import.zip
          mkdir -p /tmp/media-studio-import
          unzip -q /tmp/media-studio-import.zip -d /tmp/media-studio-import
          test -d /tmp/media-studio-import/src
          cp -a /tmp/media-studio-import/src/. .

      - name: Generate lockfile and verify project
        run: |
          npm install --package-lock-only --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run check
          npm test
          npm run build

      - name: Commit source to branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .import
          rm -f .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes detected"
            exit 1
          fi
          git commit -m "Add Media Studio using ComfyUI"
          git push origin HEAD:ai-code-chat/media-studio-import
